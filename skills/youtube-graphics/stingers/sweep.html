<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Stinger "sweep": three slanted bands in the brand colours sweep across from the left and cover the frame at 0.40 s
  (the cut happens under them), then sweep on to the right. 0.8 s, transparent outside the bands.
  Filled in by tools/stingers.py: __PRIMARY__ __ACCENT__ __LIGHT__ __DARK__ (colours), __NAME__ (channel name), font.ttf (headline font).
-->
<style>
  @font-face { font-family: Brand; src: url("font.ttf"); }
  html, body { margin:0; background:transparent; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:transparent; }
  .band { position:absolute; top:-40px; left:-320px; width:2560px; height:1160px; transform:translateX(-3000px) skewX(-18deg); }
  #b1 { background:__ACCENT__; }
  #b2 { background:__LIGHT__; }
  #b3 { background:__PRIMARY__; }
</style>
</head>
<body>
<div id="stage" data-composition-id="sweep" data-start="0" data-duration="0.8" data-width="1920" data-height="1080" data-fps="30">
  <div id="all" class="clip" data-start="0" data-duration="0.8" data-track-index="0">
    <div id="b1" class="band"></div>
    <div id="b2" class="band"></div>
    <div id="b3" class="band"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    // in: staggered, the top band (primary) lands last, exactly at the cover moment 0.40 s
    [["#b1", 0.00], ["#b2", 0.06], ["#b3", 0.12]].forEach(([id, t]) =>
      tl.fromTo(id, { x: -3000, skewX: -18 }, { x: 0, skewX: -18, duration: 0.40 - t, ease: "power3.out" }, t));
    // out: the top band leaves first, the others follow, all gone by 0.80 s
    [["#b3", 0.40], ["#b2", 0.46], ["#b1", 0.52]].forEach(([id, t]) =>
      tl.to(id, { x: 3000, duration: 0.80 - t, ease: "power3.in" }, t));
    window.__timelines = window.__timelines || {};
    window.__timelines.sweep = tl;
  </script>
</div>
</body>
</html>
