name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: choco install ffmpeg -y --no-progress
      - run: playwright install chromium
      - run: python -m pytest
      - name: Build the zip
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "__version__ = \"$version\"" tools/version.py || { echo "tools/version.py does not say $version"; exit 1; }
          git archive --format=zip --prefix="woots-editor-$version/" -o "woots-editor-$version.zip" HEAD
          sha256sum "woots-editor-$version.zip" > "woots-editor-$version.zip.sha256"
          awk -v v="$version" '/^## /{p=($2==v)} p' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            woots-editor-*.zip
            woots-editor-*.zip.sha256
